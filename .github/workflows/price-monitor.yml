name: Amazon Price Error Monitor (Cron)

on:
  # Runs automatically in the cloud every 5 minutes
  schedule:
    - cron: "*/5 * * * *"
  # Allows triggering a run manually from GitHub Actions tab
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a test Telegram alert even if no price error occurs"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: amazon-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Amazon Search API Price Monitor
        env:
          HEADLESS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.send_test_alert }}" = "true" ]; then
            node price-monitor.js --send-test-alert
          else
            node price-monitor.js
          fi

      - name: Save & Commit Updated price-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price-data.json skus.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update historical prices and averages [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No price changes to commit."
          fi
