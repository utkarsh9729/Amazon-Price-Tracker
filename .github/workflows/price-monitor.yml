name: Amazon Price Error Monitor (Cron)

on:
  # Runs automatically in the cloud every 15 minutes
  schedule:
    - cron: "*/15 * * * *"
  # Allows triggering a run manually from GitHub or via Telegram webhook
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Amazon Search API Price Monitor
        env:
          HEADLESS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node price-monitor.js

      - name: Save & Commit Updated price-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price-data.json skus.json
          git diff --staged --quiet || git commit -m "chore: update historical prices and averages [skip ci]"
          git push
